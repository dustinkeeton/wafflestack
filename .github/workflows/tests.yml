# Project-owned — NOT managed by wafflestack (unlike every waffle-*.yml here): edit it directly.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # This checkout is `unreleased` by construction, which would otherwise REFUSE every gated CLI
    # spawn below (#373). Suppresses the refusal, not the truth — the identity still resolves.
    env:
      WAFFLESTACK_ALLOW_UNRELEASED: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run typecheck

      # The CHECKOUT's own CLI, so the render under test is the PR's own stacks/** — DECISIONS #314/#316.
      - name: Verify the committed render still reproduces the lock
        run: node installer/cli.mjs doctor --allow-missing --verify-render
