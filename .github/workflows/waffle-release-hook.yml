# Managed by wafflestack (github-workflow stack) — do not edit by hand; re-render instead.
name: waffle-release-hook

on:
  pull_request:
    types: [closed]

# Never cancel an in-flight tag push.
concurrency:
  group: waffle-release-hook-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  tag:
    # `contains` never matches an empty string, so an empty releaseLabel leaves this job inert.
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'waffle:release')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The post-merge commit, NOT the ephemeral refs/pull/N/merge test-merge.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          # This token creates the tag-push EVENT: under the default GITHUB_TOKEN the tag lands but
          # GitHub's anti-recursion rule fires no downstream `on: push: tags` workflow.
          token: ${{ secrets.WAFFLE_RELEASE_TOKEN || github.token }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
      - name: Tag the merge commit
        env:
          # Data, not code: every value reaches the shell only through the environment.
          TAG_FORMAT: 'v{version}'
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          # Refuse anything that isn't strict semver — a crafted package.json version must not
          # be able to smuggle a metacharacter into the tag name or push refspec.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)*$'; then
            echo "::error::Refusing to tag: package.json version '$VERSION' is not valid semver"
            exit 1
          fi
          TAG="${TAG_FORMAT//\{version\}/$VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin — nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Lightweight tag (no -a/-m) on the merge commit; no committer identity needed — a
          # lightweight tag is a bare ref to the commit and stores no tagger name/email at all.
          # So the ONLY identity on the release path is the pushing token above (it decides who
          # the tag-push EVENT is attributed to). Keep it lightweight: switching to `-a`/`-m`
          # would make git demand a tagger identity this identity-neutral workflow does not set.
          git tag "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"
          echo "🧇 waffle-release-hook: pushed lightweight tag \`$TAG\` on merge commit \`$SHA\` (PR #$PR_NUMBER)." | tee -a "$GITHUB_STEP_SUMMARY"
