name: wafflestack
description: >-
  Self-referential stack — one user-invocable `/waffle-*` skill per wafflestack
  CLI subcommand (init, setup, install, render, upgrade, doctor, eject,
  validate, report, toggle). Each skill is a thin wrapper that runs the CLI —
  an installed `wafflestack` when one is on PATH, else `waffle.cmd` (default
  `npx --yes <waffle.toolkitRef>`) — and interprets the output with agent judgment,
  so the lifecycle commands are one keystroke away inside any consuming repo.
  `/waffle-report` is the one that leaves the repo: it wraps `report` (redacted
  diagnostics) and files a toolkit bug UPSTREAM, in the toolkit's own tracker.
  `/waffle-toggle` wraps `toggle`: per-skill agent invocation
  (`disable-model-invocation`) as a project override, persisted and re-rendered.
  The toolkit dogfoods its own delivery mechanism.
skills:
  - waffle-init
  - waffle-setup
  - waffle-install
  - waffle-render
  - waffle-upgrade
  - waffle-doctor
  - waffle-eject
  - waffle-validate
  - waffle-report
  - waffle-toggle
mods:
  - waffle-view
config:
  waffle.toolkitRef:
    required: false
    default: github:dustinkeeton/wafflestack#v{{harness.toolkitVersion}}
    description: >-
      npx spec `waffle.cmd`'s default runs (`npx --yes <ref> <subcommand>`) whenever a `/waffle-*`
      skill finds no installed `wafflestack` on PATH — the same knob
      as the doctor CI workflow's `doctor.toolkitRef`. The default is PINNED to the toolkit release
      that rendered your repo: `{{harness.toolkitVersion}}` is the running toolkit's package version
      — the value the lock records as `toolkitVersion` — so an unset key renders as
      "github:dustinkeeton/wafflestack#v0.15.0" and the toolkit your skills run is by construction
      the one that produced your render (#469, the local-invocation half of #461's CI pin). Every
      `render` re-renders these skills, so the pin moves with the lock and there is no key to
      maintain. Set the key only to run a DIFFERENT toolkit (a fork, or an explicit older tag such
      as "github:dustinkeeton/wafflestack#v0.5.0"); since #372 `upgrade` rewrites an explicit
      release-shaped pin to the toolkit that just rendered — before the render, so every `/waffle-*`
      skill picks the new ref up in the same run — and leaves a `#main`/`#<sha>` pin alone, noted.
      An UNPINNED value ("github:dustinkeeton/wafflestack", no `#tag`) is deliberately NOT the
      default: it resolves to the toolkit's DEFAULT BRANCH — not the latest release — so
      `/waffle-doctor`, `/waffle-setup`, `/waffle-init`, `/waffle-eject` and `/waffle-validate`,
      which read no toolkit content and therefore keep working, would each run an unreviewed
      upstream commit on the invoker's own machine; and `/waffle-render`, `/waffle-install`,
      `/waffle-upgrade` and `/waffle-reinstall` REFUSE (#373), with an error naming the exact pinned
      command to run instead. (That refusal is the feature: an unpinned render writes unreleased
      content while stamping the last released version number into your lock, which is what silently
      breaks `doctor --verify-render` in CI.) The same pin's `#tag` becomes the `ref` of the mod
      marketplace source rendered into `.claude/settings.json`, so `mods/waffle-view` installs from
      the toolkit version your skills run; an unpinned value renders no `ref` (#595).
      BECAUSE THE DEFAULT PINS, `/waffle-upgrade` ALWAYS STARTS FROM THE OLD CLI — expected, not a
      misconfiguration, and answered by REPORTING rather than by re-exec: a pinned CLI renders only
      its own content, so it prints `a newer toolkit release exists: vX.Y.Z` with the exact pinned
      command to run, and `/waffle-upgrade` runs that. Read "already on toolkit X" from a pinned CLI
      as "now ask the newer one", never as "you are up to date".
      Developing the toolkit ITSELF? Point this at a local checkout path, or use
      `node installer/cli.mjs --allow-unreleased` directly — rendering a working tree is the one
      case where unreleased content is the point. The toolkit's OWN repo is also the one place an
      unpinned value is right: its default branch IS the tree under test, and a version-tag pin
      would name a tag that does not exist yet on every release-bump PR.
  waffle.cmd:
    required: false
    default: npx --yes {{waffle.toolkitRef}}
    pattern: '^(?!.*(?:\$\(|\$\{\{|`))(?!\s)(?!.*\s$)[^;|&()<>\r\n]+$'
    patternHint: >-
      one program and its leading arguments — no `;`, `|`, `&`, `(`, `)`, `<`, `>`, `$(…)`,
      backticks, `${{`, newlines, or leading/trailing whitespace. Every `/waffle-*` skill appends a
      subcommand to it, so it must stay a single command a permission allowlist can match.
    description: >-
      The command prefix every `/waffle-*` skill runs the CLI with when no installed `wafflestack`
      is on PATH (#727). The default is `npx --yes` plus `waffle.toolkitRef`, so the fallback runs
      the toolkit release that rendered this repo. The skills run `wafflestack <sub>` instead only
      when an installed `wafflestack` carries the lock-following launcher (#726: `wafflestack help`
      lists `--no-follow-lock`) and is not older than the lock's `toolkitVersion`.
      To pin a different toolkit, set `waffle.toolkitRef`, not this key — `upgrade` reconciles that
      pin and never this one. To always use your installed launcher, set `waffle.cmd: wafflestack`
      in `waffle.local.yaml`.
  waffle.cmdNote:
    required: false
    description: >-
      The "which CLI to run" paragraph placed above each `/waffle-*` skill's first command, built
      from `waffle.cmd`. Set `waffle.cmd`, not this.
    default: |-
      **Which CLI to run.** Use an installed `wafflestack` only when all three hold:
      `command -v wafflestack` succeeds; `wafflestack help` lists `--no-follow-lock` (an install
      without it predates the lock-following launcher and runs its own toolkit); and the version on
      its `wafflestack vX.Y.Z` line is not older than `toolkitVersion` in `.waffle/waffle.lock.json`
      (a checkout install, or a lock with no pin, runs the installed toolkit even with the
      launcher). Then run each command below as `wafflestack` followed by the same arguments.
      Otherwise run the command as written, starting with `{{waffle.cmd}}`.
      Either way, run it as one command, not inside `$(…)` and not chained with `&&`. If
      `wafflestack` refuses (an untrusted or unreleased pin, a pin it cannot fetch while offline, a
      malformed lock) or fails because it does not know the subcommand, report its message to the
      user and stop. Do not retry through npx to get past a refusal: the refusal is the installed
      CLI's trust check doing its job, and its message names the remedies.
  waffleView.editor:
    required: false
    default: cursor
    description: >-
      The editor the `/waffle-view` pane's "Open in <editor>" button opens this repo in (#616): a
      GUI launcher on PATH, run as `<launcher> <repo>` with no shell (`cursor`, `code`, `zed`,
      `idea`, `subl`), or an argv array for one that needs flags (`[code, --new-window]`). A string
      is ONE executable, never split on spaces. Pick a launcher that hands off and exits — the
      press waits 15 seconds for it. A missing launcher or a non-zero exit shows inline in the pane
      and the pane keeps working. Read by `mods/waffle-view` from `wafflestack state --json`'s
      `config` map, not by any skill; set it nested (`config: { waffleView: { editor: code } }`),
      in `waffle.local.yaml` when the choice is yours rather than the team's.
  waffle.reportConfirmGate:
    required: false
    default: true
    modes: [true, false, prompt]
    flag: { off: "--yes" }
    nonInteractive: fail
    description: >-
      Whether `/waffle-report` shows the redacted payload and waits for a yes before filing it
      UPSTREAM in the toolkit's tracker (#487, part of #478). `true` gates every human-attended
      run; `false` never asks; `prompt` assumes nothing and asks. `--yes` skips the gate for one
      run; there is no `--confirm` token — nothing this skill does needs forcing a gate that is on
      by default. A non-interactive caller with no `--yes` FAILS rather than filing
      (`nonInteractive: fail`): the report lands in a public repo you do not own, so it is never
      filed silently — the one `--yes` skill in the toolkit with no non-interactive skip.
