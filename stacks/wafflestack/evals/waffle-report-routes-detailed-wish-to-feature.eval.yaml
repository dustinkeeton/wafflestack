# Layer 2 eval case (harness: #109). Scoped to the wafflestack stack by location.
# See schema/FORMAT.md → "Layer 2 eval cases".
#
# Guardrail under test (waffle-report skill, "Classify and draft", #669): a wish that states the
# problem and a proposed design is a feature, whatever its opening words — the rough-idea test
# only catches a wish that names no command, symptom, or design.

name: waffle-report-routes-detailed-wish-to-feature
description: >-
  An "it'd be nice if…" report that goes on to state the problem, current behavior, and a proposed
  design routes to `feature.yml` with the `enhancement` label, not to `rough-idea.yml`.

target:
  kind: skill
  name: waffle-report

prompt: |
  /waffle-report it'd be nice if doctor named the stack that rendered each drifted file.

  The problem: after an upgrade, `doctor` reported 40 drifted files and gave me no hint which
  stack to re-render or eject. Today `doctor` prints only the file paths. Proposed design: add a
  `stack:` column taken from the lock's per-file entry, plus a `--by-stack` flag that groups the
  drift list under each stack name.

  Assume `npx --yes github:dustinkeeton/wafflestack#v0.15.0 report` printed a normal <details>
  block. Show me what you would present at the confirmation gate.

assert:
  - type: includes
    value: "feature.yml"
  - type: includes
    value: "enhancement"
  - type: includes
    value: "waffle:reassess"
  - type: includes
    value: "waffle:consumer-report"
  - type: excludes
    value: "priority:"
  - type: judge
    rubric: >-
      The response routes the report to the feature form (`feature.yml`) with the form label
      `enhancement` plus the two fixed labels `waffle:reassess` and `waffle:consumer-report`, and
      no priority label — NOT to the rough-idea form, despite the "it'd be nice if" opening. The
      Problem / Motivation section is drawn from the user's stated problem (40 drifted files, no
      hint which stack; doctor prints only paths) and the Proposed Solution from the user's design
      (a `stack:` column from the lock's per-file entry, a `--by-stack` grouping flag), with no
      invented requirements beyond them. The target is the upstream toolkit repo. A pass requires:
      feature form, the form label plus the two fixed labels and nothing else, sections taken from
      the user's text, no fabricated detail.

dryRunResponse: |
  This opens as a wish but states the problem and a proposed design, so it is a feature request,
  not a rough idea.

  **Target**: `dustinkeeton/wafflestack` (from `github:dustinkeeton/wafflestack#v0.15.0`)
  **Form / labels**: `feature.yml` → `enhancement` + `waffle:reassess` + `waffle:consumer-report`
  **Title**: doctor: name the stack that rendered each drifted file

  **Body (post-redaction)**:

  ## Problem / Motivation
  After an upgrade, `doctor` reported 40 drifted files with no hint which stack to re-render or
  eject. Today it prints only the file paths.

  ## Proposed Solution
  Add a `stack:` column taken from the lock's per-file entry, plus a `--by-stack` flag that groups
  the drift list under each stack name.

  ## Context
  <details> … the `wafflestack report` block, verbatim … </details>

  File it? (yes / no)
