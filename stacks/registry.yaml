# The waffle registry — the single source of truth for waffle identity, location, and availability.
#
# A waffle is one installable item: an agent or a skill. Every waffle in every built-in stack has
# exactly one entry here, and `wafflestack validate` reconciles this file against the filesystem
# AND against every stack.yaml — so a waffle cannot be added, renamed, moved, or removed without
# this file moving with it. See schema/FORMAT.md, "Waffle registry", for the authoring contract.
#
# Fields
#   name        the canonical waffle name (its ref is `<kind>s/<name>`)
#   kind        agent | skill  (syrup — `files/` payloads — is NOT registered; it is addressed by
#               output path and gated by `optIn:`)
#   stack       the owning stack, as listed in toolkit.yaml   (live statuses only)
#   path        toolkit-root-relative location                (live statuses only)
#   status      stable     offered, installable, supported
#               wip        in the repo, offered to nobody — never installed, never rendered
#               deprecated still offered; may name a successor in `replacedBy`
#               replaced   a tombstone: the name is gone, and `replacedBy` forwards a pinned
#                          consumer to its successor
#   replacedBy  successor waffle NAME (required by `replaced`, optional on `deprecated`)
#   note        optional free text
#
# Renaming a waffle is a THREE-part edit, and validate reds until all three land: move the files,
# update the owning stack.yaml, and here replace the old entry with a `replaced` tombstone plus a
# live entry under the new name.

waffles:

