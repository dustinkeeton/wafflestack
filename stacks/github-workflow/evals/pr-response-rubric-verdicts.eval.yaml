# Layer 2 eval case (harness: #109). Scoped to the github-workflow stack by location.
# See schema/FORMAT.md → "Layer 2 eval cases".
#
# Pins pr-response scoring under rubric v3 (#385): the confirmed-blocker override is load-bearing
# (F1's honest composite sits three points under the Implement bar — #210, #532), the false-positive
# override fires, and a valid-but-cosmetic nit defers instead of auto-implementing.

name: pr-response-scores-findings-and-emits-verdicts
description: >-
  Given a mix of review findings (a confirmed blocker whose honest composite lands three points
  below the Implement bar, a cheap valid nit, and a false positive), the pr-response skill scores
  each on the v3 rubric and returns per-finding Implement / Defer / Decline verdicts with reasons —
  the confirmed-blocker override is what lifts the blocker to Implement, the false-positive
  override fires, and the cosmetic nit defers instead of auto-implementing. The judge grades
  pass/fail conditions, not exact anchors.

target:
  kind: skill
  name: pr-response

prompt: |
  /pr-response 42

  PR #42's stated purpose is adding a `--json` flag to the `report` command — that is its whole
  stated scope. It has three review findings:

  F1. [blocker] `parseRange("")` returns `[0, -1]`, so every downstream slice is silently empty.
      You traced it and reproduced the reasoning: the parse path runs on every `report`
      invocation, with or without `--json`. `report` is a read-only view — it gates no merge,
      ships no code, spends no money, and touches no secrets. The bug predates this PR and has
      nothing to do with the `--json` flag; the PR only touched `parseRange` to satisfy a lint
      rule. Fixing it means redesigning the bounds contract, which three other load-bearing
      callers with thin tests depend on — and the repo's DECISIONS.md records an accepted
      decision that freezes that contract as-is until the scheduled parser rewrite, so a fix in
      this PR contradicts that documented decision.
  F2. [nit] `tmp2` is a meaningless variable name in `load.ts` — one-line rename, fully covered
      by existing tests.
  F3. [blocker] `flush()` never closes the file handle, leaking a descriptor on every call.
      (You read `flush()`: it uses a `with` block that closes the handle on every path,
      including exceptions. The finding is wrong.)

  Score each finding on the rubric and give me your verdict table with reasons. Do not apply
  anything yet.

assert:
  # The rubric dimensions must be named — this is the tunable surface under test.
  - type: includes
    value: "Severity"
  - type: includes
    value: "Reach"
  - type: includes
    value: "Validity"
  - type: includes
    value: "Effort/Risk"
  - type: includes
    value: "Alignment"
  # The verdict vocabulary must be exactly these three tokens.
  - type: includes
    value: "Implement"
  - type: includes
    value: "Defer"
  - type: includes
    value: "Decline"
  # The behavioral check: per-finding scores, correct verdicts, and both overrides applied.
  - type: judge
    rubric: >-
      Grade the transcript against pr-response rubric v3: five dimensions (Severity, Reach,
      Validity, Effort/Risk, Alignment) scored 0-3 each, composite = their sum, verdict bands
      >=11 Implement / 5-10 Defer / <=4 Decline, plus two overrides — a confirmed blocker on live
      code (Severity 3, Validity 3, Reach >= 2) is always Implement, and Validity 0 is always
      Decline. Every sentence below is a PASS condition, a FAIL condition, or an explicit "not
      judged". Do not add conditions of your own, and do not fail the transcript for any score
      value that no condition below bounds.
      GENERAL — PASS requires that each of F1, F2 and F3 has its own five numeric dimension
      scores, a numeric composite, exactly one verdict from {Implement, Defer, Decline}, and a
      reason. FAIL if any finding lacks any of those.
      F1 — PASS requires ALL of: (a) the verdict is Implement; (b) the reason names the
      confirmed-blocker override (Severity 3, Validity 3, Reach >= 2) as what makes it Implement;
      (c) F1's composite is strictly less than 11; (d) F1's Effort/Risk score is 0 or 1; (e) F1's
      Alignment score is 0 or 1. FAIL if any of (a) through (e) does not hold — a Defer means the
      override was not applied, and a composite of 11 or more means Implement was reached by
      arithmetic rather than by the override. Guidance only, never a fail condition: F1 is
      expected around Severity 3, Reach 2, Validity 3, Effort/Risk 0, Alignment 0 (composite
      about 8); a Reach of 3 is acceptable. No F1 score value beyond the bounds in (c), (d) and
      (e) is judged.
      F2 — PASS requires that the verdict is Defer and the reason mentions a follow-up issue.
      FAIL if the verdict is Implement or Decline. F2's five dimension scores and its composite
      are not judged; in particular an Effort/Risk of 3 is not a fault.
      F3 — PASS requires that the verdict is Decline, Validity is scored 0, and the reason states
      the finding is wrong because the `with` block already closes the handle. FAIL if the
      verdict is not Decline, or if the reason declines on cost or effort rather than on the
      finding being wrong. F3's Severity, Reach, Effort/Risk and Alignment scores and its
      composite are not judged; nonzero values there are not a fault.
      OVERALL — PASS only when GENERAL, F1, F2 and F3 all pass; otherwise FAIL.

dryRunResponse: |
  <!-- waffle-pr-response -->
  **PR response** — 3 findings: 1 implemented, 1 deferred, 1 declined.

  | # | Finding | Sev | Reach | Val | E/R | Align | Score | Verdict |
  |---|---|:---:|:---:|:---:|:---:|:---:|:---:|---|
  | F1 | `parseRange("")` returns `[0, -1]` | 3 | 2 | 3 | 0 | 0 | 8 | **Implement** (override) |
  | F2 | `tmp2` is a meaningless name in `load.ts` | 1 | 1 | 3 | 3 | 2 | 10 | **Defer** |
  | F3 | `flush()` leaks the file handle | 3 | 2 | 0 | 3 | 1 | 9 | **Decline** |

  - **F1 — Implement (8, confirmed-blocker override).** Confirmed: empty input yields `[0, -1]`
    and every downstream slice is empty, on the parse path every `report` run executes. Reach 2,
    not 3: `report` is a read-only view that gates no merge, ships nothing, spends nothing and
    touches no secrets. The arithmetic says Defer: Effort/Risk 0 (redesigning a bounds contract
    three load-bearing callers with thin tests depend on) and Alignment 0 (the fix contradicts
    the DECISIONS.md freeze on that contract and sits outside the PR's stated `--json` scope). The
    confirmed-blocker override (Severity 3 · Validity 3 · Reach ≥ 2) lifts it to Implement
    regardless. Landing the bounds fix with a regression test on the empty-input case, plus tests
    pinning the three callers before the rework, and flagging the DECISIONS.md conflict in the
    PR for the owner.
  - **F2 — Defer (10).** Valid and trivial, but cosmetic: no run behaves differently, so Severity 1
    and Reach 1 keep it under the ≥11 bar. Filed into the naming-pass follow-up issue.
  - **F3 — Decline (9).** False positive (Validity 0 → auto-decline, overriding the composite):
    `flush()` wraps the handle in a `with` block, which closes it on every path including
    exceptions. There is no leak. Declining on correctness, not on cost.

  Scored with pr-response rubric **v3** (Severity · Reach · Validity · Effort/Risk · Alignment, 0–3
  each; ≥11 Implement · 5–10 Defer · ≤4 Decline).
